apiVersion: apps/v1
kind: Deployment
metadata:
  name: insuretech-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insuretech-app
  template:
    metadata:
      labels:
        app: insuretech-app
    spec:
      containers:
        - name: insuretech-app
          image: ghcr.io/yandex-practicum/scaletestapp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "15Mi"
              cpu: "100m"
            limits:
              memory: "30Mi"
              cpu: "200m"